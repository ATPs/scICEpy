[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "scICEpy"
version = "1.1.0"
description = "Single-cell Inconsistency-based Clustering Evaluation for Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "scICE Team"}
]
keywords = ["single-cell", "clustering", "RNA-seq", "scRNA-seq", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "scipy>=1.7.0",
    "matplotlib>=3.4.0",
    "python-igraph>=0.10.0",
    "leidenalg>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/ATPs/scICEpy"
Documentation = "https://github.com/ATPs/scICEpy"
Repository = "https://github.com/ATPs/scICEpy"

[tool.setuptools]
packages = ["scICEpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end smoke tests that exercise Scanpy integration and plotting",
]
